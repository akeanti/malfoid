; Malfoid firmware - https://github.com/akeanti/malfoid
;
;   pio run -e xiao -t upload     build path A: Seeed XIAO ESP32S3 + breakout boards
;   pio run -e core -t upload     build path B: the Malfoid Core PCB
;   pio test -e native            host unit tests for lib/malfoid_core
;   pio device monitor            JSON console (or use the web console on the site)

[platformio]
default_envs = xiao

[esp32]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -DMALFOID_FW_VERSION=\"0.1.0\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit NeoPixel@^1.15.0
  adafruit/Adafruit DRV2605 Library@^1.2.4

[env:xiao]
extends = esp32
board = seeed_xiao_esp32s3
build_flags =
  ${esp32.build_flags}
  -DMALFOID_BOARD_XIAO_S3

[env:core]
extends = esp32
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32.build_flags}
  -DMALFOID_BOARD_CORE

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=c++17 -Wall -Wextra
